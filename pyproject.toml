[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logicaide"
version = "0.1.0"
description = "LogicAIDE — Chrysler 68HC11 SMEC/SBEC Calibration, Telemetry, Simulation & Heritage RAG Workbench"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "xlrd>=2.0",
    "pyarrow>=26.0.1",
    "duckdb>=2.0.1",
    "lxml>=6.1.3",
    "beautifulsoup4>=4.15.0",
    "pyserial>=3.5",
    "scipy>=1.14",
    "optuna>=4.0",
    "m68hc11>=0.2.0",
]

[project.scripts]
logicaide = "logicaide.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
